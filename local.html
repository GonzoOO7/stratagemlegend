ket_sentry": "rocket_sentry.png", "rover": "rover.png", "seaf_artillery": "seaf_artillery.png", "seismic_probe": "seismic_probe.png", "shield_generator_pack": "shield_generator_pack.png", "shield_generator_relay": "shield_generator_relay.png", "solo_silo": "solo_silo.png", "sos_beacon": "sos_beacon.png", "spear": "spear.png", "speargun": "speargun.png", "sssd_delivery_long": "upload_data.png", "sssd_delivery_short": "upload_data.png", "stalwart": "stalwart.png", "sterilizer": "sterilizer.png", "super_earth_flag": "super_earth_flag.png", "supply_frv": "supply_frv.png", "supply_pack": "supply_pack.png", "tactical_video_camera": "tactical_video_camera.png", "tectonic_drill": "drill.png", "tesla_tower": "tesla_tower.png", "upload_data": "upload_data.png", "warp_pack": "warp_pack.png", "wasp_launcher": "wasp_launcher.png"};

async function loadData() {
    const list = STRATAGEMS;
    const tree = TREE;
    const icons = ICON_MAP;

    Data.stratagems = list;
    Data.roots = tree;
    Data.byId = Object.fromEntries(list.map(s => [s.id, s]));
    Data.iconOf = icons;
    Data.pathOf = indexPaths(tree);

    // An icon used by more than one stratagem makes those stratagems
    // indistinguishable in the grid, so their folder gets name labels.
    const usage = {};
    for (const [id, file] of Object.entries(icons)) {
        (usage[file] ||= []).push(id);
    }
    Data.sharedIcons = new Set(
        Object.values(usage).filter(ids => ids.length > 1).flat()
    );

    return Data;
}

// --- icons -------------------------------------------------------------------

function stratagemIcon(id) {
    const file = Data.iconOf[id];
    return file ? Paths.stratagems + file : null;
}

// Category icons follow <parent>_<node>.png, or <node>.png at the top level.
// Whitespace is dropped, so "Team reload" -> backpack_teamreload.png.
function categoryIcon(path) {
    const slug = name => name.toLowerCase().replace(/\s+/g, "");
    if (path.length === 1) return slug(path[0]) + ".png";
    return slug(path[path.length - 2]) + "_" + slug(path[path.length - 1]) + ".png";
}

function categoryIconPath(path) {
    // Vehicle has no icon of its own; it reuses the FRV one.
    if (path.length === 2 && path[1] === "Vehicle") return "vehicle_frv.png";
    return categoryIcon(path);
}

// --- tree --------------------------------------------------------------------

// A few stratagems appear in two places; the first path wins.
function indexPaths(roots) {
    const pathOf = {};

    function walk(nodes, path) {
        for (const node of nodes) {
            const here = [...path, node.name];
            for (const id of node.stratagemIds || []) {
                if (!(id in pathOf)) pathOf[id] = here;
            }
            if (node.subcategories) walk(node.subcategories, here);
        }
    }

    walk(roots, []);
    return pathOf;
}

// The current node is either the root (null) or a node with a `path` breadcrumb.
function nodeSubcategories(node) {
    return node ? node.subcategories || [] : Data.roots;
}

function nodeStratagems(node) {
    return node ? node.stratagemIds || [] : [];
}

function nodeChildren(path) {
    let nodes = Data.roots;
    let node = null;
    for (const name of path) {
        node = (nodes || []).find(n => n.name === name);
        if (!node) return null;
        nodes = node.subcategories;
    }
    return node;
}

async function sleep(ms) {
    return new Promise(res => setTimeout(res, ms));
}

async function playSfx(name) {
    const path = Sfx[name];
    if (!path) {
        console.warn('Invalid sfx: ' + name);
        return;
    }
    const sfx = new Audio(path);
    sfx.volume = sfxVolume;
    await sfx.play();
}

// Terse element builder: el("div", "tile", {title: "x"}, [child, ...])
function el(tag, className, props, children) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (props) Object.assign(node, props);
    for (const child of children || []) {
        if (child === null || child === undefined) continue;
        node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    }
    return node;
}

function randomItem(items) {
    return items[Math.floor(Math.random() * items.length)];
}

// Fisher-Yates, in place.
function shuffle(items) {
    for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
    }
    return items;
}

// Static configuration. Game data lives in assets/data/*.json and is loaded by data.js.

const sfxVolume = 0.25;

const Sfx = {
    click: "assets/sfx/arrow complete.ogg",
    correct: "assets/sfx/stratagem finish.ogg",
    wrong: "assets/sfx/arrow fail.ogg"
};

const Paths = {
    ui: "assets/icons/ui/",
    stratagems: "assets/icons/stratagems/",
    categories: "assets/icons/categories/"
};

const Sprites = {
    arrows: {
        w: Paths.ui + "w.png",
        a: Paths.ui + "a.png",
        s: Paths.ui + "s.png",
        d: Paths.ui + "d.png"
    }
};

// One stratagem at a time, endless: show its code, let the player navigate the
// tree to find it, flash the tile, then deal the next one.

const codeBoard = document.getElementById("code");
const streakEl = document.getElementById("streak");
const missesEl = document.getElementById("misses");
const revealBtn = document.getElementById("reveal");

let target = null;
let streak = 0;
let accepting = false;
let misses = 0;

// Reveal gives up the answer: pay the penalty, drop to the nearest common
// ancestor of where the player is and where the answer lives, and outline the
// next node of the route. Nothing is selected and nothing is flashed — the
// outline is the only feedback, and it persists through every render so the
// whole path can be traced by hand. The round then waits for the player to click
// the target, and wrong clicks still cost a miss on top of the reveal.
let revealed = false;

// Draw without replacement: every enabled stratagem comes up once before any of
// them can repeat. The bag refills (and reshuffles) once it runs dry, so a repeat
// is still possible across the cycle boundary - just never back to back.
let bag = [];

function dealable() {
    return Data.stratagems.filter(s => !s.disabled);
}

function refillBag() {
    bag = shuffle(dealable().map(s => s.id));
}

function drawStratagem() {
    if (bag.length === 0) refillBag();
    return Data.byId[bag.shift()];
}

function renderCode(stratagem) {
    codeBoard.replaceChildren();
    for (const key of stratagem.code) {
        codeBoard.appendChild(el("img", "", {src: Sprites.arrows[key], alt: key}));
    }
}

function setStreak() {
    streakEl.textContent = streak;
}

function setMisses() {
    missesEl.textContent = misses;
}

async function nextStratagem() {
    locked = true;
    accepting = false;
    misses = 0;
    setMisses();
    eliminated.clear();
    deadFolders.clear();
    revealed = false;
    target = drawStratagem();
    renderCode(target);
    navigate([]);
    locked = false;
    accepting = true;
}

// A wrong click rules out exactly the stratagem that was clicked, and rewinds
// to the deepest point where the player's branch was still correct — the
// longest common prefix of where they are and where the answer is. Being on
// the right branch already means no movement.
function registerMiss(id) {
    misses++;
    setMisses();
    eliminated.add(id);

    const path = Data.pathOf[target.id] || [];
    const shared = [];
    for (let i = 0; i < Math.min(currentPath.length, path.length); i++) {
        if (currentPath[i] !== path[i]) break;
        shared.push(currentPath[i]);
    }

    if (shared.length !== currentPath.length) {
        // Pushed out of a branch that cannot contain the answer. Everything
        // from the leaf up to - but not including - where we land is dead.
        for (let i = shared.length; i < currentPath.length; i++) {
            deadFolders.add(pathKey(currentPath.slice(0, i + 1)));
        }
        navigate(shared);
    } else {
        applyEliminated();   // stay put, but the new dimming must show
    }
}

// Reveal gives up the answer: pay the penalty, drop to the nearest common
// ancestor of where the player is and where the answer lives, and outline the
// next node of the route. Nothing is selected and nothing is flashed — the
// outline is the only feedback, and it persists through every render so the
// whole path can be traced by hand. The round then waits for the player to click
// the target.
async function revealSolution() {
    if (!accepting) return;    accepting = false;
    revealed = true;

    streak = 0;
    misses++;
    setStreak();
    setMisses();

    const path = Data.pathOf[target.id] || [];
    let shared = 0;
    while (shared < currentPath.length && shared < path.length
           && currentPath[shared] === path[shared]) {
        shared++;
    }
    navigate(path.slice(0, shared));
}

revealBtn.addEventListener("click", () => {
    if (!locked) revealSolution();
});

async function answer(id, tile) {
    if (!accepting && !revealed) return;

    if (id !== target.id) {
        flash(tile, "failed", 400);
        playSfx("wrong");
        streak = 0;
        setStreak();
        registerMiss(id);
        return;
    }

    accepting = false;
    locked = true;
    flash(tile, "correct", 500);
    // The click sound is still ringing; let the completion land on top of it.
    setTimeout(() => playSfx("correct"), 120);
    // A revealed round was already given up — no streak credit for walking a
    // path that was handed to you.
    if (!revealed) {
        streak++;
        setStreak();
    }

    await sleep(600);
    await nextStratagem();
}

// Tree navigation: renders the breadcrumb and the current folder's contents,
// and handles activating tiles — by click, or by keyboard (WASD to move the
// selection, Space to confirm).

const screen = document.getElementById("screen");
const breadcrumb = document.getElementById("breadcrumb");

let currentPath = [];   // [] == root
let locked = false;     // true while the correct answer animation plays
let selectable = [];    // tiles in visual order, for keyboard movement
let folderPaths = [];   // child paths, index-aligned with the folder tiles
let selectedIndex = 0;
let keyboardMode = false;   // outline only shows once WASD is used

// Stratagem ids disproven this round. Clicking one only rules out that one —
// a folder is never disproven, so the player stays put and keeps every option.
let eliminated = new Set();

// Folders the player was pushed out of after guessing a wrong branch. Only
// populated when a rewind actually happens, so wandering off by accident does
// not rule out a section you merely dipped into.
let deadFolders = new Set();

const pathKey = path => path.join(">");

// --- rendering ---------------------------------------------------------------

function renderBreadcrumb() {
    breadcrumb.replaceChildren();

    const rootCrumb = el("span", "crumb root", {textContent: "Stratagem Legend"});
    rootCrumb.addEventListener("click", () => navigate([]));
    breadcrumb.appendChild(rootCrumb);

    let acc = [];
    for (const name of currentPath) {
        acc = [...acc, name];
        const target = [...acc];
        const sep = el("span", "sep", {textContent: "›"});
        const crumb = el("span", "crumb", {textContent: name});
        crumb.addEventListener("click", () => navigate(target));
        breadcrumb.append(sep, crumb);
    }
}

// Every icon acknowledges the click with the arrow-complete sound. Correct
// stratagems add the completion sound on top (from answer()), so the two
// layer rather than replace each other.
function addTile(tile, onActivate, into) {
    tile.addEventListener("click", () => {
        if (locked) return;
        playSfx("click");
        onActivate();
    });
    into.appendChild(tile);
    selectable.push(tile);
}

// The screen is a two-column, two-row grid:
//
//     a b      a = Back, alone in the left column
//     a c      b = category tiles    c = stratagem tiles
//
// The dashed rule between b and c comes from the row gap on .grid-strats.
function renderScreen() {
    const node = nodeChildren(currentPath);
    screen.replaceChildren();
    selectable = [];
    folderPaths = [];

    const back = el("div", "grid-back");
    const cats = el("div", "grid-cats");
    const stratagems = el("div", "grid-strats");
    screen.append(back, cats, stratagems);

    const subcategories = nodeSubcategories(node);
    const stratagemIds = nodeStratagems(node);

    // "cd .." — one level up. At the root there is nowhere to go, so the tile
    // is drawn dead (see .tile.nav.off) and does nothing.
    const up = [...currentPath.slice(0, -1)];
    const backTile = el("div", "tile nav", {title: "Back"}, [
        el("img", "", {src: Paths.ui + "back.png", alt: "Back"}),
        el("span", "label", {textContent: "Back"})
    ]);
    if (currentPath.length) {
        addTile(backTile, () => navigate(up), back);
    } else {
        backTile.classList.add("off");
        back.appendChild(backTile);
    }

    for (const sub of subcategories) {
        const childPath = [...currentPath, sub.name];
        folderPaths.push(childPath);
        addTile(el("div", "tile folder", {title: sub.name}, [
            el("img", "", {src: Paths.categories + categoryIconPath(childPath), alt: ""}),
            el("span", "label", {textContent: sub.name})
        ]), () => navigate(childPath), cats);
    }
    if (subcategories.length) stratagems.classList.add("ruled");

    for (const id of stratagemIds) {
        const stratagem = Data.byId[id];
        const label = (stratagem.prefix ? stratagem.prefix + " " : "") + stratagem.name;
        const tile = el("div", "tile stratagem", {title: stratagem.name}, [
            el("img", "", {src: stratagemIcon(id), alt: ""}),
            el("span", "label", {textContent: label})
        ]);
        tile.dataset.id = id;
        addTile(tile, () => answer(id, tile), stratagems);
    }

    // Remember where WASD movement starts from — the first real tile, never the
    // Back row. The outline stays hidden until a key is actually pressed.
    selectedIndex = Math.max(0, selectable.findIndex(t => !t.classList.contains("nav")));
    applyEliminated();
    applyTrace();
    paintSelection();
}

// A dead folder takes its whole subtree with it.
function isDeadFolder(path) {
    const key = pathKey(path);
    for (const dead of deadFolders) {
        if (key === dead || key.startsWith(dead + ">")) return true;
    }
    return false;
}

// Apply the dimming to whatever is on screen. Called after every render AND
// after a miss that did not navigate, so the state never drifts from the sets.
function applyEliminated() {
    screen.querySelectorAll(".tile.stratagem").forEach(tile => {
        tile.classList.toggle("eliminated", eliminated.has(tile.dataset.id));
    });
    screen.querySelectorAll(".tile.folder").forEach((tile, i) => {
        tile.classList.toggle("eliminated", isDeadFolder(folderPaths[i]));
    });
}

function navigate(path) {
    currentPath = path;
    renderBreadcrumb();
    renderScreen();
}

// After a Reveal, the next node on the route to the answer is outlined in white.
// It follows the player down: each render outlines the child they should enter
// next, until the view holds the answer itself. Nothing off the route — and
// nothing at all once the player wanders off it — is marked.
function applyTrace() {
    if (!revealed || !target) return;

    const path = Data.pathOf[target.id] || [];
    // Only while the player is on the route, or still above it.
    if (currentPath.length > path.length) return;
    if (currentPath.some((name, i) => name !== path[i])) return;

    let tile = null;
    if (currentPath.length === path.length) {
        tile = screen.querySelector(`.tile.stratagem[data-id="${target.id}"]`);
    } else {
        // folderPaths is index-aligned with the folder tiles, and each entry is
        // the current path plus one name, so only the last one has to match.
        const next = path[currentPath.length];
        const index = folderPaths.findIndex(
            p => p.length === currentPath.length + 1 && p[p.length - 1] === next
        );
        if (index >= 0) tile = screen.querySelectorAll(".tile.folder")[index];
    }

    if (tile) tile.classList.add("traced");
}

function flash(tile, className, ms) {
    tile.classList.add(className);
    setTimeout(() => tile.classList.remove(className), ms);
}

// --- keyboard ----------------------------------------------------------------

function paintSelection() {
    selectable.forEach((tile, i) => {
        tile.classList.toggle("selected", keyboardMode && i === selectedIndex);
    });
}

function select(index) {
    const tile = selectable[index];
    if (!tile) return;
    selectedIndex = index;
    paintSelection();
    tile.scrollIntoView({block: "nearest"});
}

// Tiles sharing an offsetTop are on the same visual row.
function rowTiles(top) {
    return selectable
        .filter(tile => tile.offsetTop === top)
        .sort((a, b) => a.offsetLeft - b.offsetLeft);
}

function rowTops() {
    return [...new Set(selectable.map(tile => tile.offsetTop))].sort((a, b) => a - b);
}

// Move to the closest tile in a direction, using real geometry so that wrapped
// rows and the Back tile are handled correctly. Horizontal movement wraps: past
// the right edge drops to the next row, past the left edge climbs to the
// previous one.
function moveSelection(dx, dy) {
    if (!selectable.length) return;
    const from = selectable[selectedIndex];

    if (dy !== 0) {
        const fTop = from.offsetTop;
        const fLeft = from.offsetLeft;
        let best = -1;
        let bestScore = Infinity;
        selectable.forEach((tile, i) => {
            if (i === selectedIndex) return;
            const dTop = tile.offsetTop - fTop;
            const dLeft = tile.offsetLeft - fLeft;
            const along = dTop * dy;
            if (along <= 0) return;
            const score = along + Math.abs(dLeft) * 2;
            if (score < bestScore) {
                bestScore = score;
                best = i;
            }
        });
        if (best >= 0) select(best);
        return;
    }

    const row = rowTiles(from.offsetTop);
    const neighbour = row[row.indexOf(from) + dx];
    if (neighbour) {
        select(selectable.indexOf(neighbour));
        return;
    }

    // At the edge of the row — wrap to the adjacent one.
    const tops = rowTops();
    const nextTop = tops[tops.indexOf(from.offsetTop) + dx];
    if (nextTop === undefined) return;
    const nextRow = rowTiles(nextTop);
    if (!nextRow.length) return;
    select(selectable.indexOf(dx > 0 ? nextRow[0] : nextRow[nextRow.length - 1]));
}

document.addEventListener("keydown", event => {
    if (locked || event.ctrlKey || event.metaKey || event.altKey) return;

    // Only when nothing is focused, so form fields keep their own keys.
    const active = document.activeElement;
    if (active && active !== document.body) return;

    switch (event.key) {
        case "w": case "W": keyboardMode = true; moveSelection(0, -1); break;
        case "s": case "S": keyboardMode = true; moveSelection(0, 1); break;
        case "a": case "A": keyboardMode = true; moveSelection(-1, 0); break;
        case "d": case "D": keyboardMode = true; moveSelection(1, 0); break;
        case " ":
            event.preventDefault();               // don't scroll the page
            selectable[selectedIndex]?.click();
            break;
        default: return;
    }
});

// Moving the mouse hands control back — the keyboard outline disappears.
document.addEventListener("mousemove", () => {
    if (!keyboardMode) return;
    keyboardMode = false;
    paintSelection();
});

async function start() {
    await loadData();
    setStreak();
    await nextStratagem();
}

start();
</script>
